name: Show current date and time

# Starts at every push and pull request
on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  # This workflow contains a single job called "print-date"
  print-date:
    name: Print the current date and time
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display current date and time
        run: |
          echo "Текущая дата и время: $(date)"

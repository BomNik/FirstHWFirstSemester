spring:
  application:
    name: todoListManager
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      add-mappings: false

app:
  name: Todo List Manager
  version: 2.0.0
  api-version: 2.0.0
  attachments:
    upload-dir: uploads

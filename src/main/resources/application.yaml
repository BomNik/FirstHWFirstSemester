spring:
  application:
    name: todoListManager
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      add-mappings: false

app:
  name: Todo List Manager
  version: 3.0.0
  api-version: 2.0.0
  attachments:
    upload-dir: uploads
  security:
    pepper: ${APP_SECURITY_PEPPER:todo-list-pepper}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:todo-list-manager-jwt-secret-key-min-32-characters}
      expiration-seconds: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:3600}
